[project]
name = "pathrisk"
version = "0.1.0"
description = "Path risk vs close-to-close risk on Binance USD-M perpetuals"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "defusedxml>=0.7",
]

[project.scripts]
pathrisk = "pathrisk.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
paper = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
